<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grafik rodzinny</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f4;color:#17202a;font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:1450px;margin:auto;padding:18px}.header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}
h1{margin:0;font-size:28px}.nav{display:flex;align-items:center;gap:8px}button{border:0;border-radius:8px;background:#263238;color:#fff;padding:9px 14px;font-size:20px;cursor:pointer}
.month{min-width:210px;text-align:center;font-size:20px;font-weight:700}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.weekday{height:38px;border-radius:7px;background:#535b63;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.day{min-height:178px;background:#fff;border:1px solid #d7dce1;border-radius:8px;overflow:hidden}.day.empty{background:transparent;border:0}
.date{height:31px;background:#e9ecef;padding:7px 9px;font-weight:700}.sunday .date,.holiday .date{color:#c00000;background:#fbe3e3}.holiday{border:2px solid #e57373}
.person-slot{height:48px;padding:6px 5px 0}.person{margin:0;padding:7px 8px;border-radius:6px;font-weight:700;font-size:12px;line-height:1.2}.person small{display:block;margin-top:2px;font-size:12px}
.natalia{background:#70ad47;color:#fff}.tomasz{background:#4472c4;color:#fff}.kuba{background:#ffc000;color:#111}
.legend{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}.legend span{padding:8px 14px;border-radius:7px;font-weight:700;font-size:13px}
.note{margin-top:10px;color:#65717a;font-size:12px}@media(max-width:800px){.wrap{padding:8px}.header{flex-direction:column;align-items:stretch}h1{font-size:23px}.month{min-width:0;font-size:18px}.weekday{font-size:9px;height:32px}.calendar{gap:3px}.day{min-height:150px}.date{height:27px;padding:6px;font-size:11px}.person-slot{height:42px;padding:4px 3px 0}.person{margin:0;padding:5px;font-size:9px}.person small{font-size:9px}}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grafik Rodzinny">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  html,body{overscroll-behavior:none}
  body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .mobile-install-note{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));
    background:#111827;color:#fff;border-radius:16px;padding:12px 14px;z-index:9999;
    box-shadow:0 8px 30px rgba(0,0,0,.25);font-size:14px;display:none}
  .mobile-install-note button{float:right;border:0;background:#fff;color:#111827;border-radius:10px;padding:6px 10px}
  @media (max-width:700px){
    body{font-size:14px}
    .calendar{padding-left:6px!important;padding-right:6px!important}
  }
</style>
</head>
<body><div class="wrap">
<div class="header"><h1>📅 Grafik rodzinny</h1><div class="nav"><button onclick="move(-1)">‹</button><div id="month" class="month"></div><button onclick="move(1)">›</button></div></div>
<div id="calendar" class="calendar"></div>
<div class="legend"><span class="natalia">Natalia</span><span class="tomasz">Tomasz</span><span class="kuba">Kuba</span></div>
<div class="note">Listopad 2026 jest odwzorowany bezpośrednio z Excela. Wolne = brak wpisu. Niedziele i święta są czerwone.</div>
</div>
<script>
const M=["STYCZEŃ","LUTY","MARZEC","KWIECIEŃ","MAJ","CZERWIEC","LIPIEC","SIERPIEŃ","WRZESIEŃ","PAŹDZIERNIK","LISTOPAD","GRUDZIEŃ"];
const W=["PONIEDZIAŁEK","WTOREK","ŚRODA","CZWARTEK","PIĄTEK","SOBOTA","NIEDZIELA"];
const holidays={"2026-11-01":"Wszystkich Świętych","2026-11-11":"Narodowe Święto Niepodległości","2026-12-24":"Wigilia Bożego Narodzenia","2026-12-25":"Boże Narodzenie","2026-12-26":"Boże Narodzenie","2027-01-01":"Nowy Rok","2027-01-06":"Święto Trzech Króli"};
const data={"2026-11": {"1": [["Natalia", "07:00–19:00"], ["Tomasz", "22:00–06:00"], ["Kuba", "08:00–20:00"]], "2": [["Natalia", "07:00–19:00"], ["Tomasz", "22:00–06:00"], ["Kuba", "08:00–20:00"]], "3": [["Natalia", "07:00–19:00"], ["Tomasz", "22:00–06:00"]], "4": [["Natalia", "07:00–19:00"], ["Tomasz", "22:00–06:00"]], "5": [["Natalia", "07:00–19:00"], ["Tomasz", "22:00–06:00"], ["Kuba", "20:00–08:00"]], "6": [["Tomasz", "22:00–06:00"], ["Kuba", "20:00–08:00"]], "7": [["Kuba", "20:00–08:00"]], "8": [], "9": [], "10": [["Kuba", "19:00–07:00"]], "11": [["Kuba", "19:00–07:00"]], "12": [["Tomasz", "14:00–22:00"], ["Kuba", "20:00–08:00"]], "13": [["Natalia", "07:00–19:00"], ["Tomasz", "14:00–22:00"], ["Kuba", "20:00–08:00"]], "14": [["Natalia", "07:00–19:00"]], "15": [["Natalia", "07:00–19:00"]], "16": [["Natalia", "07:00–19:00"], ["Tomasz", "06:00–14:00"], ["Kuba", "07:00–19:00"]], "17": [["Natalia", "07:00–19:00"], ["Tomasz", "06:00–14:00"]], "18": [["Natalia", "07:00–19:00"], ["Tomasz", "06:00–14:00"]], "19": [["Natalia", "07:00–19:00"], ["Tomasz", "06:00–14:00"], ["Kuba", "08:00–20:00"]], "20": [["Tomasz", "06:00–14:00"]], "21": [["Tomasz", "06:00–14:00"]], "22": [], "23": [["Tomasz", "06:00–14:00"]], "24": [["Tomasz", "06:00–14:00"]], "25": [["Tomasz", "06:00–14:00"]], "26": [["Tomasz", "06:00–14:00"]], "27": [["Natalia", "07:00–19:00"], ["Tomasz", "06:00–14:00"]], "28": [["Natalia", "07:00–19:00"], ["Tomasz", "06:00–14:00"], ["Kuba", "20:00–08:00"]], "29": [["Natalia", "07:00–19:00"], ["Kuba", "20:00–08:00"]], "30": [["Natalia", "07:00–19:00"], ["Tomasz", "06:00–14:00"]]}, "2026-12": {"1": [["Natalia", "07:00–19:00"]], "2": [["Natalia", "07:00–19:00"]], "3": [["Natalia", "07:00–19:00"]], "4": [], "5": [], "6": [], "7": [], "8": [], "9": [], "10": [], "11": [["Natalia", "07:00–19:00"]], "12": [["Natalia", "07:00–19:00"]], "13": [["Natalia", "07:00–19:00"]], "14": [["Natalia", "07:00–19:00"]], "15": [["Natalia", "07:00–19:00"]], "16": [["Natalia", "07:00–19:00"]], "17": [["Natalia", "07:00–19:00"]], "18": [], "19": [], "20": [], "21": [], "22": [], "23": [], "24": [], "25": [["Natalia", "07:00–19:00"]], "26": [["Natalia", "07:00–19:00"]], "27": [["Natalia", "07:00–19:00"]], "28": [["Natalia", "07:00–19:00"]], "29": [["Natalia", "07:00–19:00"]], "30": [["Natalia", "07:00–19:00"]], "31": [["Natalia", "07:00–19:00"]]}, "2027-01": {"1": [], "2": [], "3": [], "4": [], "5": [], "6": [], "7": [], "8": [["Natalia", "07:00–19:00"]], "9": [["Natalia", "07:00–19:00"]], "10": [["Natalia", "07:00–19:00"]], "11": [["Natalia", "07:00–19:00"]], "12": [["Natalia", "07:00–19:00"]], "13": [["Natalia", "07:00–19:00"]], "14": [["Natalia", "07:00–19:00"]], "15": [], "16": [], "17": [], "18": [], "19": [], "20": [], "21": [], "22": [["Natalia", "07:00–19:00"]], "23": [["Natalia", "07:00–19:00"]], "24": [["Natalia", "07:00–19:00"]], "25": [["Natalia", "07:00–19:00"]], "26": [["Natalia", "07:00–19:00"]], "27": [["Natalia", "07:00–19:00"]], "28": [["Natalia", "07:00–19:00"]], "29": [], "30": [], "31": []}, "2027-02": {"1": [], "2": [], "3": [], "4": [], "5": [["Natalia", "07:00–19:00"]], "6": [["Natalia", "07:00–19:00"]], "7": [["Natalia", "07:00–19:00"]], "8": [["Natalia", "07:00–19:00"]], "9": [["Natalia", "07:00–19:00"]], "10": [["Natalia", "07:00–19:00"]], "11": [["Natalia", "07:00–19:00"]], "12": [], "13": [], "14": [], "15": [], "16": [], "17": [], "18": [], "19": [["Natalia", "07:00–19:00"]], "20": [["Natalia", "07:00–19:00"]], "21": [["Natalia", "07:00–19:00"]], "22": [["Natalia", "07:00–19:00"]], "23": [["Natalia", "07:00–19:00"]], "24": [["Natalia", "07:00–19:00"]], "25": [["Natalia", "07:00–19:00"]], "26": [], "27": [], "28": []}};
const cls={Natalia:"natalia",Tomasz:"tomasz",Kuba:"kuba"};
let cur=new Date(2026,10,1);
function render(){
 const y=cur.getFullYear(),m=cur.getMonth(),key=`${y}-${String(m+1).padStart(2,"0")}`;
 document.getElementById("month").textContent=`${M[m]} ${y}`;
 const cal=document.getElementById("calendar");cal.innerHTML="";
 W.forEach(x=>{const e=document.createElement("div");e.className="weekday";e.textContent=x;cal.appendChild(e)});
 const first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();
 for(let i=0;i<first;i++){const e=document.createElement("div");e.className="day empty";cal.appendChild(e)}
 for(let d=1;d<=days;d++){
  const dt=new Date(y,m,d),dow=(dt.getDay()+6)%7,iso=key+"-"+String(d).padStart(2,"0"),holiday=holidays[iso];
  const cell=document.createElement("div");cell.className="day"+(dow===6?" sunday":"")+(holiday?" holiday":"");
  const date=document.createElement("div");date.className="date";date.textContent=d;if(holiday)date.title=holiday;cell.appendChild(date);
  const people = data[key]?.[d] || [];
  const byName = Object.fromEntries(people.map(([name,h]) => [name,h]));
  ["Tomasz","Natalia","Kuba"].forEach(name => {
    const slot = document.createElement("div");
    slot.className = "person-slot";
    if (byName[name]) {
      const p = document.createElement("div");
      p.className = "person " + cls[name];
      p.innerHTML = `${name}<small>${byName[name]}</small>`;
      slot.appendChild(p);
    }
    cell.appendChild(slot);
  });
  cal.appendChild(cell);
 }
}
function move(n){cur=new Date(cur.getFullYear(),cur.getMonth()+n,1);render()}render();
</script>
<div id="installNote" class="mobile-install-note">
  <button onclick="this.parentElement.style.display='none'">OK</button>
  Na iPhonie: <b>Udostępnij → Do ekranu początkowego</b>
</div>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
if (window.matchMedia('(display-mode: browser)').matches && /iPhone|iPad|iPod/i.test(navigator.userAgent)) {
  setTimeout(()=>{ const n=document.getElementById('installNote'); if(n) n.style.display='block'; }, 1200);
}
</script>
</body></html>
