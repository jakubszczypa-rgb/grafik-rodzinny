<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grafik Rodzinny</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grafik Rodzinny">
<style>
:root{
  --bg:#f3f5f8;--card:#fff;--text:#17202a;--muted:#66717d;--line:#dfe4ea;
  --blue:#4472c4;--green:#70ad47;--yellow:#ffc000;--red:#c00000;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);overscroll-behavior:none}
button,input,select{font:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.app{max-width:1500px;margin:auto;padding:14px 12px 28px}
.topbar{position:sticky;top:0;z-index:20;background:rgba(243,245,248,.94);backdrop-filter:blur(16px);padding:4px 0 12px}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:25px;margin:0;font-weight:800;letter-spacing:-.5px}
.actions{display:flex;gap:7px}
.icon-btn,.today-btn{border:0;border-radius:12px;background:#111827;color:#fff;min-height:42px;padding:0 13px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.icon-btn{width:42px;padding:0;font-size:25px}
.today-btn{font-size:14px}
.month-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px}
.month{min-width:185px;text-align:center;font-size:19px;font-weight:800}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.weekday{height:32px;border-radius:9px;background:#5b6570;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.day{min-height:184px;background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.day:active{transform:scale(.995)}
.day.empty{background:transparent;border:0;box-shadow:none;cursor:default}
.date{height:32px;background:#edf0f3;padding:7px 9px;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
.sunday .date,.holiday .date{color:var(--red);background:#fbe5e5}
.holiday{border:2px solid #e57373}
.person-slot{height:49px;padding:5px 5px 0}
.person{height:43px;margin:0;padding:6px 8px;border-radius:8px;font-weight:800;font-size:11px;line-height:1.1}
.person small{display:block;margin-top:3px;font-size:11px;font-weight:700}
.natalia{background:var(--green);color:#fff}.tomasz{background:var(--blue);color:#fff}.kuba{background:var(--yellow);color:#111}
.legend{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.legend span{padding:7px 11px;border-radius:9px;font-weight:800;font-size:12px}
.note{margin-top:9px;color:var(--muted);font-size:11px;text-align:center}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:100;display:none;align-items:flex-end}
.overlay.show{display:flex}
.sheet{width:100%;max-height:92vh;background:#fff;border-radius:22px 22px 0 0;padding:12px 16px calc(18px + env(safe-area-inset-bottom));overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.grabber{width:42px;height:5px;background:#cfd5dc;border-radius:5px;margin:0 auto 12px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.sheet-title{font-size:21px;font-weight:900}
.close{border:0;background:#eef1f4;border-radius:12px;width:40px;height:40px;font-size:22px}
.person-edit{border:1px solid var(--line);border-radius:15px;padding:12px;margin:9px 0}
.person-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;font-weight:900}
.badge{padding:5px 9px;border-radius:8px;font-size:11px}
.badge.tomasz{background:var(--blue);color:#fff}.badge.natalia{background:var(--green);color:#fff}.badge.kuba{background:var(--yellow);color:#111}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:block;color:var(--muted);font-size:11px;font-weight:700;margin-bottom:4px}
select{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 9px}
.edit-actions{display:flex;gap:8px;margin-top:10px}
.save-person{flex:1;border:0;border-radius:11px;background:#111827;color:#fff;height:42px;font-weight:800}
.delete-person{border:0;border-radius:11px;background:#fbe5e5;color:#b00000;height:42px;padding:0 13px;font-weight:800}
.sheet-footer{display:flex;gap:8px;margin-top:12px}
.primary{flex:1;border:0;border-radius:13px;background:#111827;color:#fff;height:46px;font-weight:900}
.secondary{border:0;border-radius:13px;background:#eef1f4;color:#17202a;height:46px;padding:0 16px;font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:10px 15px;border-radius:12px;font-size:13px;font-weight:700;z-index:200;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:800px){
 .app{padding:8px 6px 24px}
 h1{font-size:21px}.calendar{gap:3px}.weekday{font-size:8px;height:29px}.day{min-height:160px;border-radius:8px}
 .date{height:27px;padding:5px 6px;font-size:10px}.person-slot{height:44px;padding:4px 3px 0}.person{height:39px;padding:5px 5px;font-size:8px;border-radius:7px}.person small{font-size:8px;margin-top:2px}
 .month{font-size:17px;min-width:155px}.icon-btn,.today-btn{min-height:40px}.icon-btn{width:40px}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="title-row">
      <h1>📅 Grafik Rodzinny</h1>
      <div class="actions">
        <button class="today-btn" onclick="goToday()">Dzisiaj</button>
      </div>
    </div>
    <div class="month-row">
      <button class="icon-btn" onclick="move(-1)">‹</button>
      <div id="month" class="month"></div>
      <button class="icon-btn" onclick="move(1)">›</button>
    </div>
  </div>
  <div id="calendar" class="calendar"></div>
  <div class="legend"><span class="natalia">Natalia</span><span class="tomasz">Tomasz</span><span class="kuba">Kuba</span></div>
  <div class="note">Kliknij dowolny dzień, aby dodać, zmienić lub usunąć dyżur. Zmiany zapisują się na tym iPhonie.</div>
</div>

<div id="overlay" class="overlay" onclick="if(event.target===this)closeSheet()">
  <div class="sheet">
    <div class="grabber"></div>
    <div class="sheet-head"><div id="sheetTitle" class="sheet-title"></div><button class="close" onclick="closeSheet()">×</button></div>
    <div id="editors"></div>
    <div class="sheet-footer">
      <button class="secondary" onclick="closeSheet()">Anuluj</button>
      <button class="primary" onclick="closeSheet()">Gotowe</button>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
const M=["STYCZEŃ","LUTY","MARZEC","KWIECIEŃ","MAJ","CZERWIEC","LIPIEC","SIERPIEŃ","WRZESIEŃ","PAŹDZIERNIK","LISTOPAD","GRUDZIEŃ"];
const W=["PN","WT","ŚR","CZ","PT","SB","ND"];
const people=["Tomasz","Natalia","Kuba"];
const cls={Natalia:"natalia",Tomasz:"tomasz",Kuba:"kuba"};
const holidays={
 "2026-11-01":"Wszystkich Świętych","2026-11-11":"Narodowe Święto Niepodległości",
 "2026-12-24":"Wigilia Bożego Narodzenia","2026-12-25":"Boże Narodzenie","2026-12-26":"Boże Narodzenie",
 "2027-01-01":"Nowy Rok","2027-01-06":"Święto Trzech Króli"
};

/* Listopad 2026 — źródło: Excel KALENDARZ */
const baseData={
"2026-11":{
"1":[["Tomasz","22:00–06:00"],["Natalia","07:00–19:00"],["Kuba","08:00–20:00"]],
"2":[["Tomasz","22:00–06:00"],["Natalia","07:00–19:00"],["Kuba","08:00–20:00"]],
"3":[["Natalia","07:00–19:00"]],
"4":[["Natalia","07:00–19:00"]],
"5":[["Tomasz","22:00–06:00"],["Natalia","07:00–19:00"],["Kuba","20:00–08:00"]],
"6":[["Tomasz","22:00–06:00"]],
"7":[],
"8":[],
"9":[],
"10":[["Kuba","19:00–07:00"]],
"11":[["Kuba","19:00–07:00"]],
"12":[["Tomasz","14:00–22:00"],["Natalia","07:00–19:00"],["Kuba","20:00–08:00"]],
"13":[["Tomasz","14:00–22:00"],["Natalia","07:00–19:00"],["Kuba","20:00–08:00"]],
"14":[["Natalia","07:00–19:00"]],
"15":[["Natalia","07:00–19:00"]],
"16":[["Tomasz","06:00–14:00"],["Natalia","07:00–19:00"],["Kuba","07:00–19:00"]],
"17":[["Tomasz","06:00–14:00"],["Natalia","07:00–19:00"]],
"18":[["Tomasz","06:00–14:00"],["Natalia","07:00–19:00"]],
"19":[["Tomasz","06:00–14:00"],["Natalia","07:00–19:00"],["Kuba","08:00–20:00"]],
"20":[],
"21":[],
"22":[["Tomasz","06:00–14:00"]],
"23":[["Tomasz","06:00–14:00"]],
"24":[["Tomasz","06:00–14:00"]],
"25":[["Tomasz","06:00–14:00"]],
"26":[["Tomasz","06:00–14:00"]],
"27":[["Tomasz","06:00–14:00"],["Natalia","07:00–19:00"]],
"28":[["Tomasz","06:00–14:00"],["Natalia","07:00–19:00"],["Kuba","20:00–08:00"]],
"29":[["Natalia","07:00–19:00"],["Kuba","20:00–08:00"]],
"30":[["Tomasz","06:00–14:00"],["Natalia","07:00–19:00"]]
}};

const STORAGE="grafikRodzinnyOverridesV2";
let overrides=JSON.parse(localStorage.getItem(STORAGE)||"{}");
let cur=new Date(2026,10,1);
let editingIso=null;

function isoOf(y,m,d){return `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;}
function getNataliaForDate(date){
  const anchor=new Date(2026,10,27); // 27.11.2026 = 1. dzień bloku pracy
  const diff=Math.floor((new Date(date.getFullYear(),date.getMonth(),date.getDate())-anchor)/86400000);
  return diff>=0 && (Math.floor(diff/7)%2===0) ? "07:00–19:00" : null;
}
function getBasePeople(iso){
  const [y,m,d]=iso.split("-").map(Number);
  if(iso.startsWith("2026-11")) return baseData["2026-11"][String(d)]||[];
  const dt=new Date(y,m-1,d);
  const natalia=getNataliaForDate(dt);
  return natalia ? [["Natalia",natalia]] : [];
}
function getPeople(iso){
  if(Object.prototype.hasOwnProperty.call(overrides,iso)) return overrides[iso];
  return getBasePeople(iso);
}
function saveOverrides(){localStorage.setItem(STORAGE,JSON.stringify(overrides));}
function render(){
 const y=cur.getFullYear(),m=cur.getMonth();
 document.getElementById("month").textContent=`${M[m]} ${y}`;
 const cal=document.getElementById("calendar");cal.innerHTML="";
 W.forEach(x=>{const e=document.createElement("div");e.className="weekday";e.textContent=x;cal.appendChild(e)});
 const first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();
 for(let i=0;i<first;i++){const e=document.createElement("div");e.className="day empty";cal.appendChild(e)}
 for(let d=1;d<=days;d++){
  const dt=new Date(y,m,d),dow=(dt.getDay()+6)%7,iso=isoOf(y,m,d),holiday=holidays[iso];
  const cell=document.createElement("div");
  cell.className="day"+(dow===6?" sunday":"")+(holiday?" holiday":"");
  cell.onclick=()=>openDay(iso);
  const date=document.createElement("div");date.className="date";
  date.innerHTML=`<span>${d}</span>${holiday?'<span>★</span>':''}`;
  if(holiday)date.title=holiday;cell.appendChild(date);
  const byName=Object.fromEntries(getPeople(iso).map(([name,h])=>[name,h]));
  people.forEach(name=>{
    const slot=document.createElement("div");slot.className="person-slot";
    if(byName[name]){
      const p=document.createElement("div");p.className="person "+cls[name];
      p.innerHTML=`${name}<small>${byName[name]}</small>`;slot.appendChild(p);
    }
    cell.appendChild(slot);
  });
  cal.appendChild(cell);
 }
}
function move(n){cur=new Date(cur.getFullYear(),cur.getMonth()+n,1);render();}
function goToday(){const t=new Date();cur=new Date(t.getFullYear(),t.getMonth(),1);render();showToast("Przejście do bieżącego miesiąca");}

const presets=["06:00–14:00","07:00–19:00","08:00–20:00","14:00–22:00","19:00–07:00","20:00–08:00","22:00–06:00"];
function timeOptions(selected){
 return `<option value="">Wolne / brak</option>`+presets.map(x=>`<option ${x===selected?"selected":""}>${x}</option>`).join("");
}
function openDay(iso){
 editingIso=iso;
 const [y,m,d]=iso.split("-").map(Number);
 const dt=new Date(y,m-1,d);
 document.getElementById("sheetTitle").textContent=`${d} ${M[m-1].toLowerCase()} ${y}`;
 const by=Object.fromEntries(getPeople(iso).map(([n,h])=>[n,h]));
 const editors=document.getElementById("editors");editors.innerHTML="";
 people.forEach(name=>{
   const box=document.createElement("div");box.className="person-edit";
   box.innerHTML=`
    <div class="person-head"><span>${name}</span><span class="badge ${cls[name]}">${name}</span></div>
    <label>Godziny</label>
    <select id="sel-${name}">${timeOptions(by[name]||"")}</select>
    <div class="edit-actions">
      <button class="save-person" onclick="savePerson('${name}')">Zapisz ${name}</button>
      <button class="delete-person" onclick="deletePerson('${name}')">Usuń</button>
    </div>`;
   editors.appendChild(box);
 });
 document.getElementById("overlay").classList.add("show");
}
function savePerson(name){
 const value=document.getElementById(`sel-${name}`).value;
 let arr=getPeople(editingIso).filter(([n])=>n!==name);
 if(value) arr.push([name,value]);
 arr=people.map(n=>arr.find(x=>x[0]===n)).filter(Boolean);
 overrides[editingIso]=arr;
 saveOverrides();render();openDay(editingIso);showToast(`${name}: zapisano`);
}
function deletePerson(name){
 let arr=getPeople(editingIso).filter(([n])=>n!==name);
 overrides[editingIso]=arr;
 saveOverrides();render();openDay(editingIso);showToast(`${name}: usunięto`);
}
function closeSheet(){document.getElementById("overlay").classList.remove("show");editingIso=null;}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove("show"),1600);}

render();
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
</body>
</html>
